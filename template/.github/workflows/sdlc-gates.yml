name: sdlc-gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      # Pin third-party actions to a full commit SHA in your fork (OpenSSF Scorecard: Pinned-Dependencies).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Harness gates (skills, ADRs, adapters, change records)
        run: python3 .harness/sdlc.py check
      - name: Conventional Commits and trailers
        if: github.event_name == 'pull_request'
        run: |
          for sha in $(git rev-list --no-merges origin/${{ github.base_ref }}..HEAD); do
            git log -1 --format=%B "$sha" > /tmp/msg
            python3 .harness/sdlc.py commit-msg /tmp/msg || { echo "commit $sha"; exit 1; }
          done

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest git /repo --redact --exit-code 1

  dependencies:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # Add stack-specific jobs here: build, tests, SAST, IaC scan, SBOM, signing and provenance.
  # See .agents/skills/sdlc-verify/references/sensors.md
