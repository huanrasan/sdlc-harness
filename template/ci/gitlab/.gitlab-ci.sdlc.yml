# Include from .gitlab-ci.yml:  include: { local: .gitlab-ci.sdlc.yml }
# Works on self-managed GitLab in private clouds; mirror images to an internal registry if air-gapped.
stages: [harness]

sdlc-gates:
  stage: harness
  image: python:3.12-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - apt-get update -qq && apt-get install -y -qq git >/dev/null
  script:
    - python3 .harness/sdlc.py check
    - |
      if [ -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA" ]; then
        for sha in $(git rev-list --no-merges "$CI_MERGE_REQUEST_DIFF_BASE_SHA"..HEAD); do
          git log -1 --format=%B "$sha" > /tmp/msg
          python3 .harness/sdlc.py commit-msg /tmp/msg
        done
      fi

secrets:
  stage: harness
  image:
    name: ghcr.io/gitleaks/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks git . --redact --exit-code 1
