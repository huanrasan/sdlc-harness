name: release

# Tag vX.Y.Z -> tests -> wheel/sdist + single-file bundles -> SBOM -> SLSA provenance -> keyless signatures ->
# GitHub release. Optional PyPI trusted publishing when the repository variable PUBLISH_PYPI is "true".
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Version matches tag
        run: |
          version=$(python -c "import sys; sys.path.insert(0, 'src'); import sdlc_harness; print(sdlc_harness.__version__)")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != package v$version"; exit 1; }
      - name: Tests and distribution check
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          python -m unittest discover -s tests
          python scripts/build_distribution.py --check
      - name: Build artifacts
        run: |
          python -m pip install build
          python -m build --outdir dist
          PYTHONPATH=src python -m sdlc_harness bundle --output dist/sdlc.pyz
          PYTHONPATH=src python -m sdlc_harness bundle --full --output dist/sdlc-full.pyz
      - name: SBOM
        run: docker run --rm -v "$PWD:/src" -w /src anchore/syft:v1.52.0@sha256:500e2d872ac019436926e8322b4fc1f39441d94d21f6f4046c6ff29b30e8cb02 dir:dist -o cyclonedx-json=dist/sbom.cdx.json
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Keyless signatures
        run: for f in dist/*; do cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"; done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes

  pypi:
    needs: build
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Keep only Python distributions
        run: find dist -type f ! -name "*.whl" ! -name "*.tar.gz" -delete
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
