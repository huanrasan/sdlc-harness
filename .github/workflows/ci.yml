name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      # Actions are pinned to commit SHAs (OpenSSF Scorecard: Pinned-Dependencies).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (includes graders against simulated agents)
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          python -m unittest discover -s tests -v
      - name: Distribution packages in sync (skills/, Claude Code plugin, Gemini extension)
        run: python scripts/build_distribution.py --check
      - name: Install from wheel, init every profile, upgrade is a no-op
        run: |
          python -m pip install .
          for profile in lite standard regulated; do
            dir="$RUNNER_TEMP/demo-$profile"
            git init -q "$dir"
            sdlc init "$dir" --profile "$profile" --agents claude-code,codex,copilot,cursor,gemini-cli,windsurf,opencode
            python "$dir/.harness/sdlc.pyz" --root "$dir" check
            sdlc --root "$dir" upgrade | tee "$RUNNER_TEMP/upgrade-$profile.txt"
            # `! grep ...` would skip errexit, so this assertion could never fail (shellcheck SC2251).
            if grep -q "sdlc-new" "$RUNNER_TEMP/upgrade-$profile.txt"; then
              echo "upgrade rewrote template skills; it must be a no-op"; exit 1
            fi
          done
      - name: Full single-file bundle can init without the package
        run: |
          PYTHONPATH=src python -m sdlc_harness bundle --full --output "$RUNNER_TEMP/sdlc-full.pyz"
          git init -q "$RUNNER_TEMP/bundle-demo"
          python -I "$RUNNER_TEMP/sdlc-full.pyz" init "$RUNNER_TEMP/bundle-demo" --profile lite
          python -I "$RUNNER_TEMP/bundle-demo/.harness/sdlc.pyz" --root "$RUNNER_TEMP/bundle-demo" check

  template-sensors:
    # Dogfooding: the installed template must pass the same sensors it ships (found by the first real use, v0.5.1-0.5.2).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install template into a fresh repository
        run: |
          git init -q "$RUNNER_TEMP/tpl"
          PYTHONPATH=src python -m sdlc_harness init "$RUNNER_TEMP/tpl" --profile standard
      - name: Run shipped scanners on the installed template
        working-directory: ${{ runner.temp }}/tpl
        run: |
          mkdir -p sdlc-evidence
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.176.1@sha256:34ab619bf1391a24bfda3f05debd0d8a6ce3093c2d5f9d39cfc00f83c1397823 \
            semgrep scan --config p/default --metrics off --sarif --output sdlc-evidence/sast.sarif
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f dir /repo --redact --exit-code 0 \
            --report-format sarif --report-path /repo/sdlc-evidence/secrets.sarif
          python3 .harness/sdlc.pyz evidence check --require sast,secrets
      - name: Lint the installed workflows the way the template tells projects to
        working-directory: ${{ runner.temp }}/tpl
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint:1.7.9@sha256:a0383f60d92601e2694e24b24d37df7b6a40bed7cedbc447611c50009bf02d94 -color
          pip install "zizmor==1.30.1"
          zizmor --persona=regular --min-severity=medium .
      - name: Lint this repository's own workflows
        working-directory: ${{ github.workspace }}
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint:1.7.9@sha256:a0383f60d92601e2694e24b24d37df7b6a40bed7cedbc447611c50009bf02d94 -color
          zizmor --persona=regular --min-severity=medium .github/workflows
