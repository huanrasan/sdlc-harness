name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      # Pin to full commit SHAs before the first release (OpenSSF Scorecard: Pinned-Dependencies).
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          python -m unittest discover -s tests -v
      - name: Install from wheel and run gates in every profile
        run: |
          python -m pip install .
          for profile in lite standard regulated; do
            dir="$RUNNER_TEMP/demo-$profile"
            git init -q "$dir"
            sdlc init "$dir" --profile "$profile" --agents claude-code,codex,copilot,cursor,gemini-cli,windsurf,opencode
            python "$dir/.harness/sdlc.pyz" --root "$dir" check
          done
