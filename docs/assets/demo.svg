<circle cx="20" cy="15" r="5" fill="#ff5f56"/><circle cx="38" cy="15" r="5" fill="#ffbd2e"/><circle cx="56" cy="15" r="5" fill="#27c93f"/>
<text class="title" x="76" y="19">sdlc-harness 0.7.6 - one change, gated</text>
<g class="frame f0">
<text class="cmd" x="18" y="67" xml:space="preserve">$ sdlc init . --profile standard --agents claude-code,codex</text>
<text class="out" x="18" y="86" xml:space="preserve">updated AGENTS.md skills index</text>
<text class="out" x="18" y="105" xml:space="preserve">[claude-code] created CLAUDE.md</text>
<text class="out" x="18" y="124" xml:space="preserve">[claude-code] linked .claude/skills -&gt; ../.agents/skills</text>
</g>
<g class="frame f1">
<text class="cmd" x="18" y="67" xml:space="preserve">$ sdlc new feature booking-reminders --risk medium --scope ui</text>
<text class="out" x="18" y="86" xml:space="preserve">created docs/changes/2026-09-24-booking-reminders: change.toml discovery.md spec.md design.m</text>
</g>
<g class="frame f2">
<text class="cmd" x="18" y="67" xml:space="preserve">$ sdlc status</text>
<text class="out" x="18" y="86" xml:space="preserve">profile: standard</text>
<text class="out" x="18" y="105" xml:space="preserve"></text>
<text class="out" x="18" y="124" xml:space="preserve">2026-09-24-booking-reminders  [feature risk=medium scopes=ui]  phase: discover -&gt; spec</text>
<text class="err" x="18" y="143" xml:space="preserve">  - blocks spec: docs/changes/2026-09-24-booking-reminders/discovery.md: unfilled sections (</text>
<text class="out" x="18" y="162" xml:space="preserve">  next: fix the evidence listed above, then: python3 .harness/sdlc.pyz phase 2026-09-24-book</text>
</g>
<g class="frame f3">
<text class="cmd" x="18" y="67" xml:space="preserve">$ sdlc phase &lt;id&gt; spec   # the agent filled discovery.md</text>
<text class="out" x="18" y="86" xml:space="preserve">gate blocked: 2026-09-24-booking-reminders stays in &#x27;discover&#x27;. Run `python3 .harness/sdlc.p</text>
<text class="err" x="18" y="105" xml:space="preserve">ERROR docs/changes/2026-09-24-booking-reminders/discovery.md: requires approval by one of ro</text>
<text class="err" x="18" y="124" xml:space="preserve">FAIL: 1 error(s), 0 warning(s)</text>
</g>
<g class="frame f4">
<text class="cmd" x="18" y="67" xml:space="preserve">$ sdlc approve &lt;id&gt; discovery.md --as pat --role product-owner   # a human, never the agent</text>
<text class="ok" x="18" y="86" xml:space="preserve">receipt recorded: docs/changes/2026-09-24-booking-reminders/discovery.md sha256=ae6b3a077a91</text>
<text class="out" x="18" y="105" xml:space="preserve">Commit approvals.toml and audit.jsonl, then approve the pull request on the platform.</text>
</g>
<g class="frame f5">
<text class="cmd" x="18" y="67" xml:space="preserve">$ sdlc phase &lt;id&gt; spec</text>
<text class="out" x="18" y="86" xml:space="preserve">2026-09-24-booking-reminders: discover -&gt; spec</text>
<text class="ok" x="18" y="105" xml:space="preserve">OK: 0 error(s), 0 warning(s)</text>
</g>
<g class="frame f6">
<text class="cmd" x="18" y="67" xml:space="preserve">$ sdlc check   # an approved artifact was edited afterwards</text>
<text class="err" x="18" y="86" xml:space="preserve">ERROR docs/changes/2026-09-24-booking-reminders/discovery.md: approval by pat is stale (cont</text>
<text class="err" x="18" y="105" xml:space="preserve">FAIL: 1 error(s), 0 warning(s)</text>
</g>
<g class="frame f7">
<text class="cmd" x="18" y="67" xml:space="preserve">$ sdlc explain &quot;approval by pat is stale (content changed); re-approve&quot;</text>
<text class="out" x="18" y="86" xml:space="preserve">message: approval by pat is stale (content changed); re-approve</text>
<text class="out" x="18" y="105" xml:space="preserve">  cause: The artifact changed after it was approved, so the receipt no longer matches.</text>
<text class="out" x="18" y="124" xml:space="preserve">  fix: The approver reads the delta and confirms it in one step: python3 .harness/sdlc.pyz a</text>
<text class="out" x="18" y="143" xml:space="preserve">       &lt;id&gt; &lt;artifact&gt; --as &lt;user&gt; --role &lt;role&gt;. Never drop true information from a documen</text>
<text class="out" x="18" y="162" xml:space="preserve">       protect its receipt.</text>
</g>
