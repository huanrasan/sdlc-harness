# standard: product teams. Evidence proportional to risk; independent review from medium risk.
# Every change, including a low-risk `fix`, needs an approved spec.md here: that is the point of the
# profile. For one person, or a team where each trivial fix would wait on a signature, use `lite`, where a
# low-risk fix needs no spec and no receipt. Switch with `profile` in harness.toml.
# A rule makes `artifact` mandatory once a change has moved PAST `phase`.
# approve = true additionally requires a human receipt (`sdlc approve`) by a role from roster [authority].
# scopes = [...] applies the rule only to changes declaring one of those scopes (change.toml `scopes`).

[[rules]]
artifact = "discovery.md"
phase = "discover"
types = ["feature", "architecture"]
min_risk = "medium"
approve = true

[[rules]]
artifact = "spec.md"
phase = "spec"
types = ["fix", "feature", "architecture", "retirement"]
min_risk = "low"
approve = true

[[rules]]
artifact = "design.md"
phase = "design"
types = ["feature"]
min_risk = "medium"
approve = true

[[rules]]
artifact = "design.md"
phase = "design"
types = ["architecture", "retirement"]
min_risk = "low"
approve = true

[[rules]]
artifact = "adr"
phase = "design"
types = ["architecture"]
min_risk = "low"
approve = true

[[rules]]
artifact = "threat-model.md"
phase = "design"
types = ["feature"]
min_risk = "high"
approve = true

[[rules]]
artifact = "threat-model.md"
phase = "design"
types = ["architecture"]
min_risk = "medium"
approve = true

[[rules]]
artifact = "ux.md"
phase = "design"
types = ["feature", "architecture"]
min_risk = "low"
scopes = ["ui"]

[[rules]]
artifact = "data.md"
phase = "design"
types = ["fix", "feature", "architecture", "retirement"]
min_risk = "low"
scopes = ["data"]

[[rules]]
artifact = "data.md"
phase = "design"
types = ["fix", "feature", "architecture", "retirement"]
min_risk = "low"
scopes = ["personal-data"]
approve = true

[[rules]]
artifact = "cost.md"
phase = "design"
types = ["feature", "architecture"]
min_risk = "medium"
scopes = ["infra"]

[[rules]]
artifact = "ai-risk.md"
phase = "design"
types = ["fix", "feature", "architecture", "retirement"]
min_risk = "low"
scopes = ["ai"]
approve = true

[[rules]]
artifact = "retirement.md"
phase = "design"
types = ["retirement"]
min_risk = "low"
approve = true

[[rules]]
artifact = "plan.md"
phase = "plan"
types = ["feature"]
min_risk = "medium"

[[rules]]
artifact = "plan.md"
phase = "plan"
types = ["architecture", "retirement"]
min_risk = "low"

[[rules]]
artifact = "verification.md"
phase = "verify"
types = ["fix", "feature", "architecture", "retirement"]
min_risk = "low"

[[rules]]
artifact = "review.md"
phase = "review"
types = ["fix", "feature", "architecture", "retirement"]
min_risk = "medium"

[[rules]]
artifact = "release.md"
phase = "release"
types = ["feature", "architecture", "retirement"]
min_risk = "medium"
approve = true

[[rules]]
artifact = "runbook.md"
phase = "release"
types = ["feature"]
min_risk = "high"

[[rules]]
artifact = "runbook.md"
phase = "release"
types = ["architecture"]
min_risk = "medium"

[[rules]]
artifact = "outcome.md"
phase = "operate"
types = ["feature"]
min_risk = "medium"

[sensors]
# error | warn | off. test_first, weakened_tests and contracts run when a base ref is given (CI: check --base).
test_first = "warn"
weakened_tests = "error"
architecture = "error"
contracts = "error"
# Evidence files `sdlc evidence check` requires in the evidence directory (see harness.toml [evidence]).
require_evidence = ["secrets", "sast", "sca", "sbom"]

[commits]
require_trailers = []
