# standard: product teams. Evidence proportional to risk; independent review from medium risk.
# A rule makes `artifact` mandatory once a change has moved PAST `phase`.
# approve = true additionally requires a human receipt (`sdlc approve`) by a role from roster [authority].

[[rules]]
artifact = "spec.md"
phase = "spec"
types = ["fix", "feature", "architecture"]
min_risk = "low"
approve = true

[[rules]]
artifact = "design.md"
phase = "design"
types = ["feature"]
min_risk = "medium"
approve = true

[[rules]]
artifact = "design.md"
phase = "design"
types = ["architecture"]
min_risk = "low"
approve = true

[[rules]]
artifact = "adr"
phase = "design"
types = ["architecture"]
min_risk = "low"
approve = true

[[rules]]
artifact = "threat-model.md"
phase = "design"
types = ["feature"]
min_risk = "high"
approve = true

[[rules]]
artifact = "threat-model.md"
phase = "design"
types = ["architecture"]
min_risk = "medium"
approve = true

[[rules]]
artifact = "plan.md"
phase = "plan"
types = ["feature"]
min_risk = "medium"

[[rules]]
artifact = "plan.md"
phase = "plan"
types = ["architecture"]
min_risk = "low"

[[rules]]
artifact = "verification.md"
phase = "verify"
