# regulated: organizations with audit/compliance duties. Every change leaves full evidence.
# Pair with branch protection, CODEOWNERS approval and signed commits on the VCS platform.
# A rule makes `artifact` mandatory once a change has moved PAST `phase`.
# approve = true additionally requires a human receipt (`sdlc approve`) by a role from roster [authority].
# scopes = [...] applies the rule only to changes declaring one of those scopes (change.toml `scopes`).

[[rules]]
artifact = "discovery.md"
phase = "discover"
types = ["feature", "architecture"]
min_risk = "low"
approve = true

[[rules]]
artifact = "spec.md"
phase = "spec"
types = ["fix", "feature", "architecture", "retirement"]
min_risk = "low"
approve = true

[[rules]]
artifact = "design.md"
phase = "design"
types = ["feature", "architecture", "retirement"]
min_risk = "low"
approve = true

[[rules]]
artifact = "adr"
phase = "design"
types = ["architecture"]
min_risk = "low"
approve = true

[[rules]]
artifact = "threat-model.md"
phase = "design"
types = ["feature"]
min_risk = "medium"
approve = true

[[rules]]
artifact = "threat-model.md"
phase = "design"
types = ["architecture"]
min_risk = "low"
approve = true

