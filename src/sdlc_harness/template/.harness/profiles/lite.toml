# lite: individuals and small teams. Minimum evidence, no mandatory human-review artifacts.
# A rule makes `artifact` mandatory once a change has moved PAST `phase`.
# approve = true additionally requires a human receipt (`sdlc approve`) by a role from roster [authority].
# scopes = [...] applies the rule only to changes declaring one of those scopes (change.toml `scopes`).

[[rules]]
artifact = "spec.md"
phase = "spec"
types = ["feature", "architecture", "retirement"]
min_risk = "low"

[[rules]]
artifact = "spec.md"
phase = "spec"
types = ["fix"]
min_risk = "medium"

[[rules]]
artifact = "design.md"
phase = "design"
types = ["architecture"]
min_risk = "low"

[[rules]]
artifact = "design.md"
phase = "design"
types = ["feature"]
min_risk = "high"

[[rules]]
artifact = "adr"
phase = "design"
types = ["architecture"]
min_risk = "low"

[[rules]]
artifact = "data.md"
phase = "design"
types = ["fix", "feature", "architecture", "retirement"]
min_risk = "low"
scopes = ["personal-data"]

[[rules]]
artifact = "ai-risk.md"
phase = "design"
types = ["fix", "feature", "architecture", "retirement"]
min_risk = "low"
scopes = ["ai"]

[[rules]]
artifact = "retirement.md"
phase = "design"
types = ["retirement"]
min_risk = "low"

[[rules]]
artifact = "verification.md"
phase = "verify"
types = ["fix", "feature", "architecture", "retirement"]
min_risk = "medium"

[sensors]
# error | warn | off. test_first, weakened_tests and contracts run when a base ref is given (CI: check --base).
test_first = "off"
weakened_tests = "warn"
architecture = "error"
contracts = "error"
# Evidence files `sdlc evidence check` requires in the evidence directory (see harness.toml [evidence]).
require_evidence = []

[commits]
require_trailers = []
