# lite: individuals and small teams. Minimum evidence, no mandatory human-review artifact.
# A rule makes `artifact` mandatory once a change has moved PAST `phase`.
# approve = true additionally requires a human receipt (`sdlc approve`) by a role from roster [authority].

[[rules]]
artifact = "spec.md"
phase = "spec"
types = ["feature", "architecture"]
min_risk = "low"

[[rules]]
artifact = "spec.md"
phase = "spec"
types = ["fix"]
min_risk = "medium"

[[rules]]
artifact = "design.md"
phase = "design"
types = ["architecture"]
min_risk = "low"

[[rules]]
artifact = "design.md"
phase = "design"
types = ["feature"]
min_risk = "high"

[[rules]]
artifact = "adr"
phase = "design"
types = ["architecture"]
min_risk = "low"

[[rules]]
artifact = "verification.md"
phase = "verify"
types = ["fix", "feature", "architecture"]
min_risk = "medium"

[commits]
require_trailers = []
