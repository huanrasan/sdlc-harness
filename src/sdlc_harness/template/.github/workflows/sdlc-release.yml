name: sdlc-release

# Tag-driven release: gates -> build -> SBOM + license policy -> SLSA provenance and SBOM attestations ->
# keyless signatures (Sigstore) -> GitHub release. Verify downstream with:
#   gh attestation verify dist/<file> --repo <owner>/<repo>
#   cosign verify-blob dist/<file> --bundle dist/<file>.sigstore.json \
#     --certificate-identity-regexp 'https://github.com/<owner>/<repo>/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
# Signing uses --new-bundle-format, the current Sigstore bundle. cosign 3 reads it as shown above; cosign 2.x needs
# --new-bundle-format on verify-blob too. The flag is set explicitly so the format does not change under you when
# the installer starts shipping a different cosign major.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Require human approval: create a protected "production" environment with required reviewers.
    environment: production
    steps:
      # Actions are pinned to commit SHAs; Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Gates on the tagged commit
        run: python3 .harness/sdlc.pyz check
      - name: Build
        # Contract: scripts/build-release is executable, takes no arguments, and leaves everything that will be
        # published in dist/. Documented in harness.toml [release] and the sdlc-release skill.
        run: |
          if [ ! -x scripts/build-release ]; then
            echo "Create an executable scripts/build-release that writes release artifacts to dist/"; exit 1
          fi
          scripts/build-release
          test -n "$(ls -A dist)"
      - name: SBOM (CycloneDX) and license policy
        # The source comes from harness.toml [release] sbom_source: scanning dist/ as a directory when the artifact
        # is an OCI archive produces an SBOM of the tarball, not of the image.
        run: |
          mkdir -p sdlc-evidence
          SBOM_SOURCE="$(python3 .harness/sdlc.pyz config release.sbom_source --default dir:dist)"
          echo "SBOM source: $SBOM_SOURCE"
          docker run --rm -v "$PWD:/src" -w /src anchore/syft:v1.52.0@sha256:500e2d872ac019436926e8322b4fc1f39441d94d21f6f4046c6ff29b30e8cb02 "$SBOM_SOURCE" -o cyclonedx-json=sdlc-evidence/sbom.json
          python3 .harness/sdlc.pyz evidence check --require sbom
          cp sdlc-evidence/sbom.json dist/sbom.cdx.json
      - name: Build provenance attestation (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      - name: SBOM attestation
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: "dist/*"
          sbom-path: sdlc-evidence/sbom.json
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Keyless signatures
        run: |
          for f in dist/*; do
            cosign sign-blob --yes --new-bundle-format --bundle "$f.sigstore.json" "$f"
          done
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
