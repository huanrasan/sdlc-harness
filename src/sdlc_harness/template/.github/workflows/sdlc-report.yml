name: sdlc-report

# Weekly visibility: delivery flow and DORA-style metrics as a downloadable HTML page and JSON (for dashboards).
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Generate reports
        run: |
          mkdir -p sdlc-report
          python3 .harness/sdlc.pyz report flow --since 90d --format html --output sdlc-report/flow.html
          python3 .harness/sdlc.pyz report flow --since 90d --format json --output sdlc-report/flow.json
          python3 .harness/sdlc.pyz report dora --since 90d --format html --output sdlc-report/dora.html
          python3 .harness/sdlc.pyz report dora --since 90d --format json --output sdlc-report/dora.json
          python3 .harness/sdlc.pyz check > sdlc-report/check.txt || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdlc-report
          path: sdlc-report/
