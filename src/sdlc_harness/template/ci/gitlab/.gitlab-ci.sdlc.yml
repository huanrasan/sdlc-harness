# Include from .gitlab-ci.yml:  include: { local: .gitlab-ci.sdlc.yml }
# Works on self-managed GitLab in private clouds; mirror images to an internal registry if air-gapped.
# Approval verification requires: project setting "Remove all approvals when commits are added" and a
# GITLAB_TOKEN CI variable (read_api scope).
stages: [harness]

sdlc-gates:
  stage: harness
  image: python:3.12-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apt-get update -qq && apt-get install -y -qq git >/dev/null
  script:
    - |
      if [ -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA" ]; then
        python3 .harness/sdlc.pyz check --base "$CI_MERGE_REQUEST_DIFF_BASE_SHA"
        python3 .harness/sdlc.pyz approvals verify --platform gitlab --base "$CI_MERGE_REQUEST_DIFF_BASE_SHA"
        for sha in $(git rev-list --no-merges "$CI_MERGE_REQUEST_DIFF_BASE_SHA"..HEAD); do
          git log -1 --format=%B "$sha" > /tmp/msg
          python3 .harness/sdlc.pyz commit-msg /tmp/msg
        done
      else
        python3 .harness/sdlc.pyz check
      fi
    - python3 .harness/sdlc.pyz codeowners --check

secrets:
  stage: harness
  image:
    name: ghcr.io/gitleaks/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks git . --redact --exit-code 1
