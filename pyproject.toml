[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sdlc-harness"
version = "0.5.0"
description = "Agent-agnostic harness for the software development lifecycle"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sdlc = "sdlc_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sdlc_harness = ["template/**/*", "template/**/.*", "template/.*/**/*", "template/.*/**/.*"]
